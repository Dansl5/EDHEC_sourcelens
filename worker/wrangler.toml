name = "sourcelens-check"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Per-IP rate limit: 10 checks per 60 seconds. Remove this block if your wrangler version rejects it;
# the Worker works without it (Gemini's own free quota is then the only cap).
[[ratelimits]]
name = "RL"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60
